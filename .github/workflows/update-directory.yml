# NON IN USO (D-031): richiede ANTHROPIC_API_KEY (API a consumo), che l'utente ha scelto di non usare.
# Gli aggiornamenti dei dati si fanno in una sessione Claude Code con gli agenti di .claude/agents/ (vedi docs/automation.md).
# Il file resta come riferimento: non ha schedule attivo e, senza la chiave, l'avvio manuale fallisce.
# Aggiornamento mensile della directory aziende con Claude Code headless (agente directory-researcher) e PR da approvare.
# STATO: schedule SPENTO, avvio manuale attivo (workflow_dispatch). Per attivarlo togli il commento al blocco `schedule`.
# Secret richiesto: ANTHROPIC_API_KEY. Variabili opzionali: CLAUDE_MODEL (default sonnet), MAX_TURNS (default 40).
# Le PR le approva sempre una persona: il workflow non fa mai merge. Vedi docs/automation.md.
name: Aggiorna directory

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '43 4 1 * *' # primo giorno del mese, 04:43 UTC

permissions:
  contents: write # branch bot/directory-*
  pull-requests: write # PR ed etichetta

concurrency:
  group: update-directory
  cancel-in-progress: false

jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
      MAX_TURNS: ${{ vars.MAX_TURNS || '40' }}
    steps:
      - name: Controlla il secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Secret ANTHROPIC_API_KEY mancante."; exit 1; fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Data di oggi (Europe/Rome)
        id: today
        run: echo "date=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"

      - name: Ricerca aziende (directory-researcher)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --agent directory-researcher
            --model ${{ env.MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(node scripts/geocode/geocode.mjs *),Bash(npm run validate *),Bash(date *),Bash(mv src/content/companies/* data/_pending/companies/*)"
          prompt: |
            Oggi è ${{ steps.today.outputs.date }} (Europe/Rome). Esegui l'aggiornamento mensile della directory aziende di aisicilia.it.

            Segui alla lettera la tua spec `docs/specs/directory-researcher.md` e leggi `CLAUDE.md`.
            1. Ricontrolla i record esistenti in `src/content/companies/`: apri sito e fonti, verifica link morti, attività cessate, cambi di sede o di nome, e che l'AI sia ancora centrale. Aggiorna i campi cambiati e `last_verified`.
            2. Azienda chiusa, sito non più raggiungibile in modo stabile o dato non più verificabile: non cancellare. Sposta il record in `data/_pending/companies/` aggiungendo `pending_reason` con il motivo e la fonte consultata. Sarà la persona che approva la PR a decidere.
            3. Cerca nuovi ingressi dalle fonti in `docs/sources.md` e crea i record (verificati in `src/content/companies/`, dubbi in `data/_pending/companies/`).

            Vincoli non negoziabili, validi anche in questa esecuzione automatica:
            - zero dati inventati: ogni campo deve risultare da fonti che hai aperto davvero;
            - solo dati aziendali, nessun dato personale (nemmeno dei fondatori);
            - descrizioni riscritte con parole tue, mai copiate né parafrasate da vicino; niente loghi di terzi;
            - niente scraping di LinkedIn o Crunchbase né di siti che lo vietano; rispetta robots.txt; massimo 1 richiesta al secondo per dominio;
            - coordinate solo con `node scripts/geocode/geocode.mjs`;
            - scrivi solo in `src/content/companies/`, `data/_pending/companies/`, `docs/sources.md` e nel log.

            Non eseguire operazioni git (commit, push, branch): le fa il workflow. Non lanciare `npm run build`.
            Alla fine esegui `npm run validate -- --content` e correggi gli errori sui tuoi file.
            Scrivi il log `docs/runs/${{ steps.today.outputs.date }}-directory.md` nel formato di `docs/runs/README.md` (max 40 righe): data, modello (${{ env.MODEL }}), turni/token se noti, record aggiunti/modificati/spostati (con motivo), fonti consultate, errori.

      - name: Valida i contenuti
        run: npm run validate -- --content

      - name: Controlla se ci sono modifiche ai dati
        id: changes
        run: |
          n=$(git status --porcelain -- src/content data docs/sources.md | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Modifiche ai dati: $n"

      - name: Log di riserva se l'agente non l'ha scritto
        if: steps.changes.outputs.count != '0'
        run: |
          f="docs/runs/${{ steps.today.outputs.date }}-directory.md"
          if [ ! -f "$f" ]; then
            mkdir -p docs/runs
            {
              echo "# Directory — ${{ steps.today.outputs.date }}"
              echo
              echo "Il log non è stato scritto dall'agente. Modello: ${MODEL}. File toccati:"
              echo
              git status --porcelain -- src/content data docs/sources.md | sed 's/^/- /'
            } > "$f"
          fi

      - name: Etichetta "dati"
        if: steps.changes.outputs.count != '0'
        run: gh label create dati --description "Aggiornamento dati da pipeline automatica" --color 0E8A16 --force

      - name: Apri la Pull Request
        if: steps.changes.outputs.count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/directory-${{ steps.today.outputs.date }}
          base: main
          title: "Directory: aggiornamento del ${{ steps.today.outputs.date }}"
          commit-message: "Directory: aggiornamento automatico del ${{ steps.today.outputs.date }}"
          labels: dati
          body-path: docs/runs/${{ steps.today.outputs.date }}-directory.md
          add-paths: |
            src/content/companies
            data/_pending/companies
            docs/sources.md
            docs/runs
          delete-branch: true

      - name: Salva i file prodotti se il job fallisce
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: directory-${{ steps.today.outputs.date }}
          path: |
            src/content/companies
            data/_pending/companies
            docs/sources.md
            docs/runs
          retention-days: 7
          if-no-files-found: ignore
